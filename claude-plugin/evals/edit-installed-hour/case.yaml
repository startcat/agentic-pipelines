schema_version: "1.0"
name: edit-installed-hour
description: "Moving an installed pipeline to another hour changes the cron only and proposes a reinstall."
tags: [edit-pipeline]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Move weekly-report to 08:00. It is installed."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Bash(bun run ./engine/src/cli/index.ts validate:*)"
    - "Bash(bun run ./engine/src/cli/index.ts status:*)"
    - "Bash(bun run ./engine/src/cli/index.ts show:*)"
    - "Write"
    - "Edit"
  append_system_prompt: "For this session, the agentic-pipelines CLI is `bun run ./engine/src/cli/index.ts`: the engine is checked out at ./engine in the working directory, and no other `pipelines` command should be used. Nobody will answer follow-up questions: if the skill would ask the person something, ask it and stop."
runs: 1
graders:
  - type: llm
    name: changes-only-the-cron
    criteria: "The pipeline.yaml shown has the cron \"0 8 * * 1\" and still has everything else it started with: the params source_repo and reports_dir, a throttle of 144h, notify on failed with stale_after 360h on the email channel, and the steps collect (shell) and write (agent, max_cost_usd 0.25)."
    focus:
      source: file
      path: pipelines/weekly-report/pipeline.yaml
  - type: llm
    name: validates
    criteria: "The agent ran the CLI's validate command on weekly-report after the change."
    focus: trace
  - type: llm
    name: proposes-reinstall
    criteria: "The reply says the scheduled job keeps the old time until it is reinstalled and proposes `pipelines install weekly-report` (on this machine or on the one that runs it), asking before doing it."
    focus: last_message
  - type: tool_used
    name: does-not-install
    tool: Bash
    input_match: "(pipelines|index\\.ts)( --repo \\S+)? (install|uninstall|run|resume)\\b"
    min: 0
    max: 0
