schema_version: "1.0"
name: edit-param
description: "An installed param changes through install --set, never by editing .params.local.json."
tags: [edit-pipeline]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Set docs-check's repo param to ~/docs."
  max_turns: 20
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Bash(bun run ./engine/src/cli/index.ts validate:*)"
    - "Bash(bun run ./engine/src/cli/index.ts status:*)"
    - "Bash(bun run ./engine/src/cli/index.ts show:*)"
    - "Write"
    - "Edit"
  append_system_prompt: "For this session, the agentic-pipelines CLI is `bun run ./engine/src/cli/index.ts`: the engine is checked out at ./engine in the working directory, and no other `pipelines` command should be used. Nobody will answer follow-up questions: if the skill would ask the person something, ask it and stop."
runs: 1
graders:
  - type: llm
    name: proposes-install-set
    criteria: "The reply proposes `pipelines install docs-check --set repo=<path>` with the path written out as an absolute path (the home folder expanded, not starting with `~`), says why, and asks before running it."
    focus: last_message
  - type: file_exists
    name: no-params-file
    path: ".params.local.json"
    exists: false
  - type: tool_used
    name: does-not-install
    tool: Bash
    input_match: "index\\.ts.*\\b(install|uninstall|run|resume)\\b"
    max: 0
