schema_version: "1.0"
name: new-pipeline-complete
description: "With every answer given up front, it writes a pipeline that validates and does not run or install it."
tags: [new-pipeline]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I want a pipeline that reviews the stale pull requests of the repo I keep at ~/src/app and emails me a summary. Run it every Monday at 07:00. A PR is stale after 7 days without updates. It needs gh and jq, and github.com. Cap the agent at $0.50 per run. Notify me on the email channel when it fails and when it succeeds. The repo path should be a param. Use the existing writer agent. That is everything: write it and validate it, but do not run or install it."
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Bash(bun run ./engine/src/cli/index.ts:*)"
    - "Bash(command -v:*)"
    - "Bash(test:*)"
    - "Bash(realpath:*)"
    - "Bash(ls:*)"
    - "Write"
    - "Edit"
  append_system_prompt: "For this session, the agentic-pipelines CLI is `bun run ./engine/src/cli/index.ts`: the engine is checked out at ./engine in the working directory, and no other `pipelines` command should be used. Nobody will answer follow-up questions: if the skill would ask the person something, ask it and stop."
runs: 1
graders:
  - type: llm
    name: writes-the-pipeline
    criteria: "A pipelines/<name>/pipeline.yaml was written with a Monday 07:00 cron, a param for the repo path, an agent step with max_cost_usd of at most 0.5, and notify on the email channel for failed and success."
    focus: files
  - type: llm
    name: validated-green
    criteria: "The agent ran the CLI's validate command on the new pipeline and the last validate it ran passed."
    focus: trace
  - type: tool_used
    name: no-run-or-install
    tool: Bash
    input_match: "index\\.ts.*\\b(install|uninstall|run|resume)\\b"
    max: 0
