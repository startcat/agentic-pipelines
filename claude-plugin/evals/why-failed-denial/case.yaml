schema_version: "1.0"
name: why-failed-denial
description: "A run whose agent step was denied a write is explained as a sandbox denial."
tags: [pipelines-status]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Why did weekly-report fail?"
  max_turns: 20
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Bash(bun run ./engine/src/cli/index.ts validate:*)"
    - "Bash(bun run ./engine/src/cli/index.ts status:*)"
    - "Bash(bun run ./engine/src/cli/index.ts show:*)"
  append_system_prompt: "For this session, the agentic-pipelines CLI is `bun run ./engine/src/cli/index.ts`: the engine is checked out at ./engine in the working directory, and no other `pipelines` command should be used. Nobody will answer follow-up questions: if the skill would ask the person something, ask it and stop."
runs: 1
graders:
  - type: llm
    name: names-the-denial
    criteria: "The reply says the write step was denied writing /Users/me/Desktop/weekly-report.md because it is outside the folder the step may write to (its cwd, the reports_dir param), and treats that denial as the cause rather than only the missing summary."
    focus: last_message
  - type: llm
    name: proposes-a-fix
    criteria: "The reply proposes a concrete fix, such as telling the step's prompt to write inside its cwd or changing cwd, and does not change any file without asking."
    focus: last_message
