schema_version: "1.0"
name: why-failed-budget
description: "A run that hit its spending cap is explained as such."
tags: [pipelines-status]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Why did weekly-report fail?"
  max_turns: 20
  timeout_seconds: 600
  allowed_tools:
    - "Skill"
    - "Read"
    - "Glob"
    - "Grep"
    - "Bash(bun run ./engine/src/cli/index.ts validate:*)"
    - "Bash(bun run ./engine/src/cli/index.ts status:*)"
    - "Bash(bun run ./engine/src/cli/index.ts show:*)"
  append_system_prompt: "For this session, the agentic-pipelines CLI is `bun run ./engine/src/cli/index.ts`: the engine is checked out at ./engine in the working directory, and no other `pipelines` command should be used. Nobody will answer follow-up questions: if the skill would ask the person something, ask it and stop."
runs: 1
graders:
  - type: llm
    name: names-the-cap
    criteria: "The reply says the write step ran out of its spending cap (max_cost_usd of 0.25, error_max_budget_usd) after spending about $0.25."
    focus: last_message
  - type: llm
    name: proposes-a-fix
    criteria: "The reply proposes a concrete fix, such as raising max_cost_usd or giving the agent less to read, and does not change any file without asking."
    focus: last_message
